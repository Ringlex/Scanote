name: note
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

# Flutter 3.41.0 / Dart 3.11.0 (patrz .fvmrc)
environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  adaptive_theme: ^3.4.1
  bloc_concurrency: ^0.3.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.6
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.9
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  json_annotation: ^4.9.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
 
  intl: any
  injectable: ^2.3.2
  shared_preferences: ^2.2.2

  flutter_secure_storage: ^10.3.1
  fpdart: ^1.1.0
  animated_bottom_navigation_bar: ^1.3.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1

  path: ^1.9.0
  table_calendar: ^3.1.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  google_sign_in: ^7.2.0
  
  http: ^1.2.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.16.0
  qr_flutter: ^4.1.0

  crypto: ^3.0.3

  logging: ^1.3.0
  google_mlkit_barcode_scanning: ^0.15.0
  share_plus: ^13.3.0
  speech_to_text: ^7.4.0
  pinput: ^6.0.2
  home_widget: ^0.9.3
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  build_runner: ^2.4.7
  envied_generator: ^1.3.8
  freezed: ^3.2.5
  mockingjay: ^2.1.0
  mocktail: ^1.0.1
  platform: ^3.1.3
  injectable_generator: ^2.4.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.6.0
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true

  # Turns on gen_l10n, which builds lib/core/l10n/translations.dart out of the
  # .arb files. Required as of Flutter 3.41, where the build fails without it.
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/svg/
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F1D2B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
